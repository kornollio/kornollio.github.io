document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

seIn 1.1s cubic-bezier(.2,.7,.2,1) both\">\n      \u003Csc-if value=\"{{ isRu }}\" hint-placeholder-val=\"{{ true }}\">\n        \u003Ch1 style=\"margin:0;font-size:clamp(52px,13vw,190px);line-height:0.86;font-weight:500;letter-spacing:-0.045em;text-transform:uppercase\">Привет\u003C/h1>\n      \u003C/sc-if>\n      \u003Csc-if value=\"{{ isEn }}\" hint-placeholder-val=\"{{ false }}\">\n        \u003Ch1 style=\"margin:0;font-size:clamp(52px,13vw,190px);line-height:0.86;font-weight:500;letter-spacing:-0.045em;text-transform:uppercase\">Hello\u003C/h1>\n      \u003C/sc-if>\n      \u003Cdiv style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:flex-end;border-top:1px solid rgba(233,230,225,0.22);padding-top:16px\">\n        \u003Csc-if value=\"{{ isRu }}\" hint-placeholder-val=\"{{ true }}\">\n          \u003Cp style=\"margin:0;max-width:48ch;font-size:15px;line-height:1.5;color:rgba(233,230,225,0.82);text-wrap:pretty\">Я Андрей Осягин. Делаю продукты в \u003Ca href=\"https://www.avito.ru\" target=\"_blank\" rel=\"noopener\" style=\"border-bottom:1px solid rgba(233,230,225,0.4)\">Авито Недвижимости\u003C/a> в роли ведущего менеджера продукта.\u003C/p>\n        \u003C/sc-if>\n        \u003Csc-if value=\"{{ isEn }}\" hint-placeholder-val=\"{{ false }}\">\n          \u003Cp style=\"margin:0;max-width:48ch;font-size:15px;line-height:1.5;color:rgba(233,230,225,0.82);text-wrap:pretty\">I'm Andrey Osyagin. I build products at \u003Ca href=\"https://www.avito.ru\" target=\"_blank\" rel=\"noopener\" style=\"border-bottom:1px solid rgba(233,230,225,0.4)\">Avito Real Estate\u003C/a> as a lead product manager.\u003C/p>\n        \u003C/sc-if>\n        \u003Cspan style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(233,230,225,0.55)\">{{ heroMeta }}\u003C/span>\n      \u003C/div>\n    \u003C/div>\n  \u003C/section>\n\n  \u003Csection id=\"tennis\" class=\"tk-sec\">\n    \u003Cdiv class=\"tk-mono\" style=\"flex:0 0 auto;color:rgba(255,255,255,0.85)\">{{ tennisLabel }}\u003C/div>\n    \u003Cdiv class=\"tk-mono\" style=\"flex:0 0 auto;color:rgba(255,255,255,0.6)\">{{ tennisMeta }}\u003C/div>\n\n    \u003Cdiv style=\"flex:1 1 100%\">\u003Cp class=\"tk-intro\">{{ tennisIntro }}\u003C/p>\u003C/div>\n\n    \u003Cdiv class=\"tk-grid\">\n      \u003Csc-for list=\"{{ skills }}\" as=\"k\" hint-placeholder-count=\"2\">\n        \u003Carticle class=\"tk-card\">\n          \u003Cdiv class=\"tk-video\">\n            \u003Cvideo data-tk-autoplay=\"1\" src=\"{{ k.video }}\" data-poster=\"{{ k.poster }}\" muted=\"\" loop=\"\" playsinline=\"\" preload=\"none\" aria-label=\"{{ k.title }}\">\u003C/video>\n          \u003C/div>\n          \u003Cdiv class=\"tk-head\">\n            \u003Cspan class=\"tk-mono\" style=\"color:rgba(255,255,255,0.6)\">{{ k.tag }}\u003C/span>\n            \u003Ch3 class=\"tk-title\">{{ k.title }}\u003C/h3>\n            \u003Ccode class=\"tk-code\">{{ k.slug }}\u003C/code>\n          \u003C/div>\n          \u003Cdiv class=\"tk-body\">\n            \u003Cp class=\"tk-desc\">{{ k.desc }}\u003C/p>\n            \u003Cdiv class=\"tk-mono\" style=\"color:rgba(255,255,255,0.55);margin:2px 0 10px\">{{ modelsLabel }}\u003C/div>\n            \u003Cul class=\"tk-models\">\n              \u003Csc-for list=\"{{ k.models }}\" as=\"m\" hint-placeholder-count=\"5\">\n                \u003Cli>\u003Cspan class=\"tk-model\">{{ m.name }}\u003C/span>\u003Cspan class=\"tk-role\">{{ m.role }}\u003C/span>\u003C/li>\n              \u003C/sc-for>\n            \u003C/ul>\n            \u003Cdiv class=\"tk-actions\">\n              \u003Ca class=\"tk-pill tk-pill-solid\" href=\"{{ k.zip }}\" download=\"\">{{ k.downloadLabel }}\u003C/a>\n              \u003Cbutton type=\"button\" class=\"tk-pill\" sc-camel-on-click=\"{{ k.open }}\">{{ guideLabel }}\u003C/button>\n            \u003C/div>\n          \u003C/div>\n        \u003C/article>\n      \u003C/sc-for>\n    \u003C/div>\n\n    \u003Cp class=\"tk-mono\" style=\"flex:1 1 100%;margin:0;text-align:center;color:rgba(255,255,255,0.6)\">{{ tennisCta }}\u003C/p>\n  \u003C/section>\n\n  \u003Csection id=\"about\" style=\"position:relative;min-height:100svh;padding:104px 20px 60px;background:linear-gradient(to bottom, #f0a163 0%, #ee9663 22%, #e79a80 42%, #c2a5a2 60%, #9aa8b0 76%, #7f8f9b 88%, #5d6c78 100%);color:#2a1c14;display:flex;flex-wrap:wrap;align-content:space-between;justify-content:space-between;gap:clamp(24px,5vw,72px)\">\n    \u003Cdiv style=\"flex:1 1 100%;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:baseline;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase\">\n      \u003Cspan style=\"color:rgba(60,30,14,0.85)\">{{ aboutLabel }}\u003C/span>\n      \u003Cspan style=\"color:rgba(60,30,14,0.6)\">{{ aboutMeta }}\u003C/span>\n    \u003C/div>\n\n    \u003Cdiv style=\"flex:1 1 240px;max-width:340px;margin-top:clamp(0px,6vh,80px);animation:floatA 11s ease-in-out infinite\">\n      \u003Csc-if value=\"{{ isRu }}\" hint-placeholder-val=\"{{ true }}\">\n        \u003Cp style=\"margin:0;font-size:clamp(17px,1.5vw,21px);line-height:1.45;color:#3a2314;text-wrap:pretty\">Недвижимость — длинный цикл и дорогие решения. Люблю задачи, где данные спорят с интуицией, а выигрывает третье: разговор с пользователем.\u003C/p>\n      \u003C/sc-if>\n      \u003Csc-if value=\"{{ isEn }}\" hint-placeholder-val=\"{{ false }}\">\n        \u003Cp style=\"margin:0;font-size:clamp(17px,1.5vw,21px);line-height:1.45;color:#3a2314;text-wrap:pretty\">Real estate is a long cycle and expensive decisions. I like problems where data argues with intuition and a third thing wins: talking to the user.\u003C/p>\n      \u003C/sc-if>\n    \u003C/div>\n\n    \u003Cdiv style=\"flex:0 1 220px;align-self:center;animation:floatB 13s ease-in-out infinite\">\n      \u003Cimg src=\"media/about.webp\" alt=\"Андрей Осягин на закате\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;display:block;border-radius:4px;box-shadow:0 40px 80px rgba(58,30,12,0.35)\">\n    \u003C/div>\n\n    \u003Cdiv style=\"flex:1 1 240px;max-width:320px;align-self:flex-end;margin-bottom:clamp(0px,8vh,90px);animation:floatA 15s ease-in-out infinite\">\n      \u003Csc-if value=\"{{ isRu }}\" hint-placeholder-val=\"{{ true }}\">\n        \u003Cp style=\"margin:0;font-size:clamp(17px,1.5vw,21px);line-height:1.45;color:#20303a;text-wrap:pretty\">Вне работы — большой теннис. Корт лечит от иллюзии, что всё под контролем: там видно, что ты умеешь, а что только рассказываешь.\u003C/p>\n      \u003C/sc-if>\n      \u003Csc-if value=\"{{ isEn }}\" hint-placeholder-val=\"{{ false }}\">\n        \u003Cp style=\"margin:0;font-size:clamp(17px,1.5vw,21px);line-height:1.45;color:#20303a;text-wrap:pretty\">Off work it's tennis. The court cures the illusion of control: it shows what you can actually do, not what you talk about.\u003C/p>\n      \u003C/sc-if>\n    \u003C/div>\n  \u003C/section>\n\n  \u003Csection id=\"talks\" style=\"position:relative;min-height:100svh;padding:104px 20px 60px;background:radial-gradient(120% 95% at 46% 12%, #d9a05a 0%, #b7752f 32%, #7d4a17 58%, #2c1706 86%, #150b03 100%);display:flex;flex-wrap:wrap;align-content:space-between;justify-content:space-between;gap:clamp(24px,5vw,64px)\" data-comment-anchor=\"7ec13a1856-section\">\n    \u003Cdiv style=\"flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.85)\">{{ talksLabel }}\u003C/div>\n    \u003Cdiv style=\"flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.6)\">{{ talksMeta }}\u003C/div>\n\n    \u003Cdiv style=\"flex:1 1 100%;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(24px,3vw,48px)\">\n      \u003Csc-for list=\"{{ talks }}\" as=\"t\" hint-plac n\n    \u003Cp style=\"flex:1 1 100%;margin:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.6)\" data-comment-anchor=\"c211d3aa67-p\">{{ talksCta }}\u003C/p>\n  \u003C/section>\n\n  \u003Csection id=\"contact\" style=\"position:relative;min-height:100svh;padding:104px 20px 40px;background:radial-gradient(110% 85% at 50% 78%, #cfd8dd 0%, #7f95a3 26%, #3c5364 52%, #14222c 80%, #08090a 100%);display:flex;flex-wrap:wrap;align-content:space-between;justify-content:space-between;gap:clamp(24px,5vw,60px)\">\n    \u003Cdiv sc-camel-on-click=\"{{ addMark }}\" style=\"position:absolute;inset:0;z-index:0;cursor:crosshair\">\u003C/div>\n    \u003Csc-for list=\"{{ marks }}\" as=\"m\" hint-placeholder-count=\"0\">\n      \u003Cspan style=\"position:absolute;z-index:0;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;pointer-events:none;animation:markIn 900ms cubic-bezier(.2,.7,.2,1) both;left:{{ m.left }};top:{{ m.top }};background:{{ m.glow }}\">\u003C/span>\n    \u003C/sc-for>\n\n    \u003Cdiv style=\"position:relative;z-index:1;flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.85)\">{{ contactLabel }}\u003C/div>\n    \u003Cdiv style=\"position:relative;z-index:1;flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.6)\">{{ contactMeta }}\u003C/div>\n\n    \u003Cdiv style=\"position:relative;z-index:1;flex:1 1 100%;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center\" data-comment-anchor=\"7e7d2e9d2f-div\">\n      \u003Ca href=\"mailto:for@privetandrey.ru\" style=\"font-size:clamp(28px,6.4vw,96px);line-height:1;letter-spacing:-0.04em;font-weight:500;color:#fff;word-break:break-word\" style-hover=\"opacity:0.65\">for@privetandrey.ru\u003C/a>\n      \u003Csc-if value=\"{{ isRu }}\" hint-placeholder-val=\"{{ true }}\">\n        \u003Cp style=\"margin:0;max-width:40ch;font-size:15px;line-height:1.55;color:rgba(255,255,255,0.75);text-wrap:pretty\">Если хотите куда-то меня позвать — напишите. Вопрос, ссылка, одна строка: этого достаточно.\u003C/p>\n      \u003C/sc-if>\n      \u003Csc-if value=\"{{ isEn }}\" hint-placeholder-val=\"{{ false }}\">\n        \u003Cp style=\"margin:0;max-width:40ch;font-size:15px;line-height:1.55;color:rgba(255,255,255,0.75);text-wrap:pretty\">If you'd like to invite me somewhere — just write. A question, a link, one line: that's enough.\u003C/p>\n      \u003C/sc-if>\n      \u003Cdiv style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:4px\">\n        \u003Csc-for list=\"{{ socials }}\" as=\"s\" hint-placeholder-count=\"4\">\n          \u003Ca href=\"{{ s.href }}\" target=\"_blank\" rel=\"noopener\" style=\"position:relative;display:inline-flex;gap:10px;align-items:baseline;padding:12px 22px;border-radius:999px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;background:linear-gradient(140deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.12) 42%, rgba(255,255,255,0.05) 60%, rgba(255,255,255,0.22) 100%);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.65), inset 0 -1px 2px rgba(255,255,255,0.28), inset 0 0 22px rgba(255,255,255,0.12), 0 18px 34px rgba(6,18,26,0.35);transition:transform 320ms cubic-bezier(.2,.7,.2,1), box-shadow 320ms ease, background 320ms ease\" style-hover=\"transform:translateY(-3px) scale(1.02);background:linear-gradient(140deg, rgba(255,255,255,0.46) 0%, rgba(255,255,255,0.18) 42%, rgba(255,255,255,0.08) 60%, rgba(255,255,255,0.3) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.8), inset 0 -1px 3px rgba(255,255,255,0.35), inset 0 0 26px rgba(255,255,255,0.18), 0 24px 46px rgba(6,18,26,0.42)\">\n            \u003Cspan>{{ s.name }}\u003C/span>\n            \u003Cspan style=\"color:rgba(255,255,255,0.72);text-transform:none\">{{ s.handle }}\u003C/span>\n          \u003C/a>\n        \u003C/sc-for>\n      \u003C/div>\n    \u003C/div>\n\n    \u003Cdiv style=\"position:relative;z-index:1;flex:1 1 100%;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.6)\">\n      \u003Cspan>{{ markHint }}\u003C/span>\n      \u003Cspan style=\"color:rgba(255,255,255,0.9)\">{{ markLine }}\u003C/span>\n    \u003C/div>\n\n    \u003Cdiv style=\"position:relative;z-index:1;flex:1 1 100%;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.5)\">\n      \u003Cspan>© Андрей Осягин, 1991–2026\u003C/span>\n      \u003Cspan style=\"text-transform:none;font-style:italic;letter-spacing:0.02em;max-width:60ch\">{{ disclaimer }}\u003C/span>\n      \u003Cspan>privetandrey.ru\u003C/span>\n    \u003C/div>\n  \u003C/section>\n\n  \u003Csc-if value=\"{{ guideOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    \u003Cdiv class=\"tk-overlay\" role=\"dialog\" aria-modal=\"true\" aria-label=\"{{ guide.title }}\">\n      \u003Cdiv class=\"tk-scrim\" sc-camel-on-click=\"{{ closeGuide }}\">\u003C/div>\n      \u003Cdiv class=\"tk-modal\">\n        \u003Cdiv class=\"tk-modal-top\">\n          \u003Cdiv style=\"display:flex;flex-direction:column;gap:6px\">\n            \u003Cspan class=\"tk-mono\" style=\"color:rgba(255,255,255,0.55)\">{{ guide.kicker }}\u003C/span>\n            \u003Ch3 class=\"tk-title\" style=\"margin:0\">{{ guide.title }}\u003C/h3>\n          \u003C/div>\n          \u003Cbutton type=\"button\" class=\"tk-close\" sc-camel-on-click=\"{{ closeGuide }}\" aria-label=\"{{ closeLabel }}\">×\u003C/button>\n        \u003C/div>\n        \u003Col class=\"tk-steps\">\n          \u003Csc-for list=\"{{ guide.steps }}\" as=\"s\" hint-placeholder-count=\"6\">\n            \u003Cli class=\"tk-step\">\n              \u003Cspan class=\"tk-step-n\">{{ s.n }}\u003C/span>\n              \u003Cdiv class=\"tk-step-body\">\n                \u003Cdiv class=\"tk-step-title\">{{ s.title }}\u003C/div>\n                \u003Cp class=\"tk-step-text\">{{ s.text }}\u003C/p>\n                \u003Csc-if value=\"{{ s.hasCode }}\" hint-placeholder-val=\"{{ false }}\">\n                  \u003Cdiv class=\"tk-codeblock\">\n                    \u003Cpre>{{ s.code }}\u003C/pre>\n                    \u003Cbutton type=\"button\" class=\"tk-copy\" sc-camel-on-click=\"{{ s.copy }}\">{{ s.copyLabel }}\u003C/button>\n                  \u003C/div>\n                \u003C/sc-if>\n              \u003C/div>\n            \u003C/li>\n          \u003C/sc-for>\n        \u003C/ol>\n        \u003Cdiv class=\"tk-modal-foot\">\n          \u003Ca class=\"tk-pill tk-pill-solid\" href=\"{{ guide.zip }}\" download=\"\">{{ guide.downloadLabel }}\u003C/a>\n          \u003Cspan class=\"tk-mono\" style=\"color:rgba(255,255,255,0.5);text-transform:none;letter-spacing:0.04em\">{{ guide.note }}\u003C/span>\n        \u003C/div>\n      \u003C/div>\n    \u003C/div>\n  \u003C/sc-if>\n\u003C/div>\n\n\u003C/x-dc>\n\u003Cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;hero&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;aura-blue&quot;,&quot;aura-amber&quot;,&quot;aura-rose&quot;,&quot;sunset&quot;],&quot;default&quot;:&quot;aura-blue&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Главный экран&quot;}}\">\nclass Component extends DCLogic {\n  state = { marks: [], lang: \"ru\", guide: null, copied: null };\n\n  componentDidMount() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(\"pa-marks\") || \"[]\");\n      if (Array.isArray(saved)) this.setState({ marks: saved.slice(-60) });\n    } catch (e) {}\n    let lang = null;\n    try {\n      const q = new URLSearchParams(location.search).get(\"lang\");\n      lang = q === \"en\" || q === \"ru\" ? q : localStorage.getItem(\"pa-lang\");\n    } catch (e) {}\n    if (!lang && typeof navigator !== \"undefined\" && navigator.language && !/^ru/i.test(navigator.language)) lang = \"en\";\n    if (lang === \"en\" || lang === \"ru\") this.setState({ lang });\n    this.syncDocLang(lang || \"ru\");\n    this.setupAutoplay();\n    this.onKey = (e) => { if (e.key === \"Escape\" && this.state.guide) this.closeGuide(); };\n    window.addEventListener(\"keydown\", this.onKey);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"keydown\", this.onKey);\n    if (this.io) this.io.disconnect();\n  }\n\n  setupAutoplay() {\n    const attach = () => {\n      const vids = document.querySelectorAll(\"video[data-tk-autoplay]\");\n      if (!vids.length) return false;\n      if (!this.io && \"IntersectionObserver\" in window) {\n        this.io = new IntersectionObserver((entries) => {\n          entries.forEach((en) => {\n            const v = en.target;\n            if (en.isIntersecting) {\n              v.muted = true;\n              if (v.preload !== \"auto\") v.preload = \"auto\";\n              const p = v.play();\n              if (p && p.catch) p.catch(() => {});\n            } else if (!v.paused) v.pause();\n          });\n        }, { threshold: 0.35 });\n      }\n      this.seen = this.seen || new WeakSet();\n      vids.forEach((v) => {\n        if (this.seen.has(v)) return;\n        this.seen.add(v);\n        v.muted = true;\n        v.loop = true;\n        if (v.dataset.poster && v.dataset.poster.indexOf(\"{{\") \u003C 0) v.setAttribute(\"poster\", v.dataset.poster);\n        v.setAttribute(\"muted\", \"\");\n        v.setAttribute(\"playsinline\", \"\");\n        if (this.io) this.io.observe(v); else { v.autoplay = true; v.play().catch(() => {}); }\n      });\n      return true;\n    };\n    if (!attach()) requestAnimationFrame(() => { if (!attach()) setTimeout(attach, 300); });\n  }\n\n  syncDocLang(lang) {\n    try {\n      document.documentElement.setAttribute(\"lang\", lang);\n      const title = lang === \"en\"\n        ? \"Andrey Osyagin — product manager, Avito Real Estate\"\n        : \"Андрей Осягин — продуктовый менеджер, Авито Недвижимость\";\n      const setTitle = () => {\n        const node = document.querySelector(\"title\");\n        if (node && node.textContent !== title) node.textContent = title;\n        if (document.title !== title) document.title = title;\n      };\n      setTitle();\n      requestAnimationFrame(setTitle);\n      setTimeout(setTitle, 60);\n      const alts = [\n        [\"ru\", \"https://privetandrey.ru/?lang=ru\"],\n        [\"en\", \"https://privetandrey.ru/?lang=en\"],\n        [\"x-default\", \"https://privetandrey.ru/\"]\n      ];\n      alts.forEach(([code, href]) => {\n        let link = document.querySelector('link[rel=\"alternate\"][hreflang=\"' + code + '\"]');\n        if (!link) {\n          link = document.createElement(\"link\");\n          link.setAttribute(\"rel\", \"alternate\");\n          link.setAttribute(\"hreflang\", code);\n          document.head.appendChild(link);\n        }\n        link.setAttribute(\"href\", href);\n      });\n    } catch (e) {}\n  }\n\n  componentDidUpdate() {\n    this.syncDocLang(this.state.lang);\n    this.setupAutoplay();\n  }\n\n  openGuide = (key) => {\n    this.setState({ guide: key, copied: null });\n    try { document.body.style.overflow = \"hidden\"; } catch (e) {}\n  };\n\n  closeGuide = () => {\n    this.setState({ guide: null, copied: null });\n    try { document.body.style.overflow = \"\"; } catch (e) {}\n  };\n\n  copyText = (id, text) => {\n    const done = () => { this.setState({ copied: id }); clearTimeout(this.copyT); this.copyT = setTimeout(() => this.setState({ copied: null }), 1600); };\n    try {\n      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => {});\n      else { const ta = document.createElement(\"textarea\"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand(\"copy\"); ta.remove(); done(); }\n    } catch (e) {}\n  };\n\n  tennisContent(en) {\n    const rallyRun = en\n      ? \"Make a rally breakdown of ~/Desktop/game.MOV. Near player — Anna, far — Max. Labels in English.\"\n      : \"Сделай разбор розыгрыша по видео ~/Desktop/game.MOV. Ближний игрок — Анна, дальний — Макс. Подписи на русском.\";\n    const playerRun = en\n      ? \"Break down my strokes in ~/Desktop/player.MP4. Name on the card — Ivan, handle @your_handle, English, show speed.\"\n      : \"Разбери мои удары по видео ~/Desktop/player.MP4. Имя на карточке — Иван, ник @your_handle, русский, скорость показывать.\";\n    const install = (slug) => \"mkdir -p ~/.claude/skills\\nunzip ~/Downloads/\" + slug + \".zip -d ~/.claude/skills/\";\n    const req = en\n      ? { title: \"What you need\", text: \"macOS (Apple Silicon recommended — YOLO runs on the MPS GPU), Claude Code, ffmpeg and uv. About 2 GB of disk for the Python environment and model weights.\" }\n      : { title: \"Что понадобится\", text: \"macOS (лучше Apple Silicon — YOLO считается на GPU через MPS), Claude Code, ffmpeg и uv. Около 2 ГБ на диске под Python-окружение и веса моделей.\" };\n    const reqCode = \"brew install ffmpeg uv\";\n    const inst = en\n      ? { title: \"Install the skill\", text: \"Unzip the archive into ~/.claude/skills and restart Claude Code. The skill shows up in the list and triggers by itself when you ask for a tennis breakdown.\" }\n      : { title: \"Установите скилл\", text: \"Распакуйте архив в ~/.claude/skills и перезапустите Claude Code. Скилл появится в списке и сработает сам, когда вы попросите разобрать теннисное видео.\" };\n    const first = en\n      ? { title: \"First run\", text: \"Nothing to set up by hand: on the first run Claude creates the environment (scripts/setup.sh → ~/.cache/tennis-rally-breakdown) and downloads the YOLO weights. That takes 3–5 minutes once.\" }\n      : { title: \"Первый запуск\", text: \"Руками ничего настраивать не нужно: при первом запуске Claude сам создаст окружение (scripts/setup.sh → ~/.cache/tennis-rally-breakdown) и скачает веса YOLO. Это 3–5 минут, один раз.\" };\n    const guides = {\n      rally: {\n        kicker: en ? \"A — How to run\" : \"A — Как запустить\",\n        title: en ? \"Rally breakdown\" : \"Разбор розыгрыша\",\n        zip: \"skills/tennis-rally-breakdown.zip\",\n        note: en ? \"Speeds are estimates, roughly ±10 km/h\" : \"Скорость — оценка, примерно ±10 км/ч\",\n        steps: [\n          { ...req, code: reqCode },\n          { ...inst, code: install(\"tennis-rally-breakdown\") },\n          first,\n          en\n            ? { title: \"Film it right\", text: \"Tripod behind the baseline, low and wide, the whole court in frame. The camera must not pan or zoom. 4K/60 helps a lot: the far-side ball is only 3–4 px.\" }\n            : { title: \"Снимите правильно\", text: \"Штатив за задней линией, низко и широко, весь корт в кадре. Камера не должна двигаться и зумить. 4K/60 сильно помогает: мяч на дальней половине — всего 3–4 пикселя.\" },\n          en\n            ? { title: \"Ask Claude\", text: \"Give it the path to the video and the player names. Who stands nearer to the camera is analysed by default.\", code: rallyRun }\n            : { title: \"Попросите Claude\", text: \"Дайте путь к видео и имена игроков. По умолчанию анализируется тот, кто ближе к камере.\", code: rallyRun },\n          en\n            ? { title: \"Answer a couple of questions\", text: \"Claude tracks players and the ball, calibrates the court from its lines and marks every shot frame by frame. Then it asks what is hard to see from far away: who won each rally and where the last ball went (net or out).\" }\n            : { title: \"Ответьте на пару вопросов\", text: \"Claude трекает игроков и мяч, калибрует корт по разметке и размечает каждый удар по кадрам. Потом спросит то, что плохо видно издалека: кто выиграл розыгрыш и куда ушёл последний мяч — в сетку или в аут.\" },\n          en\n            ? { title: \"Get the video\", text: \"First it shows a few preview frames to check that the trace sits on the real ball, then renders a 1080×1920 mp4 with the original sound. Roughly 5–10 minutes per minute of footage.\" }\n            : { title: \"Получите ролик\", text: \"Сначала Claude покажет несколько превью-кадров, чтобы проверить, что трасса лежит на настоящем мяче, затем отрендерит mp4 1080×1920 с исходным звуком. В среднем 5–10 минут на минуту видео.\" }\n        ]\n      },\n      player: {\n        kicker: en ? \"B — How to run\" : \"B — Как запустить\",\n        title: en ? \"Player breakdown\" : \"Разбор игрока\",\n        zip: \"skills/tennis-player-breakdown.zip\",\n        note: en ? \"Speed is measured for part of the shots, ±25%\" : \"Скорость меряется не для всех ударов, ±25%\",\n        steps: [\n          { ...req, code: reqCode },\n          { ...inst, code: install(\"tennis-player-breakdown\") },\n          first,\n          en\n            ? { title: \"Film it right\", text: \"Handheld or on a gimbal (DJI Osmo Pocket, phone), vertical, from behind the player, keeping them in frame. Your own racket hits on the audio track help find the exact contact moment.\" }\n            : { title: \"Снимите правильно\", text: \"С рук или со стабилизатора (DJI Osmo Pocket, телефон), вертикально, со спины игрока, держа его в кадре. Звук ударов на дорожке помогает найти точный момент контакта.\" },\n          en\n            ? { title: \"Ask Claude\", text: \"Give it the path to the video, the name for the card, a handle (or none) and the language.\", code: playerRun }\n            : { title: \"Попросите Claude\", text: \"Дайте путь к видео, имя для карточки, ник (или без него) и язык.\", code: playerRun },\n          en\n            ? { title: \"Check the strokes\", text: \"Claude finds swing candidates by wrist speed, confirms each stroke by eye (forehand or backhand), times the contact by the racket sound and measures speed where the ball is visible. It reports the count and FH/BH split — correct it if something is off.\" }\n            : { title: \"Проверьте удары\", text: \"Claude найдёт кандидатов по скорости кисти, подтвердит каждый удар глазами (форхенд или бэкхенд), уточнит контакт по звуку ракетки и измерит скорость там, где мяч виден. Скажет число ударов и split — поправьте, если что-то не так.\" },\n          en\n            ? { title: \"Pick a style and get the video\", text: \"Three looks: Clay (dark glass card), Broadcast (TV band) and Minimal. Claude can render one frame in each so you choose. Output: 1080×1920 mp4 with the original sound.\" }\n            : { title: \"Выберите стиль и получите ролик\", text: \"Три варианта: Clay (тёмная стеклянная карточка), Broadcast (ТВ-плашка) и Minimal. Claude может показать один кадр в каждом, чтобы вы выбрали. На выходе — mp4 1080×1920 с исходным звуком.\" }\n        ]\n      }\n    };\n    const skills = [\n      {\n        key: \"rally\",\n        letter: \"A\",\n        slug: \"tennis-rally-breakdown\",\n        video: \"media/tennis-rally.mp4\",\n        poster: \"media/tennis-rally.jpg\",\n        zip: \"skills/tennis-rally-breakdown.zip\",\n        size: en ? \"35 KB\" : \"35 КБ\",\n        tag: en ? \"Static camera · whole court\" : \"Статичная камера · весь корт\",\n        title: en ? \"Rally breakdown\" : \"Разбор розыгрыша\",\n        desc: en\n          ? \"A tripod video from behind the baseline becomes a vertical analytics reel: ball trace, player tags, shot map, forehands and backhands, estimated speed and a session summary.\"\n          : \"Видео со штатива за задней линией превращается в вертикальный аналитический ролик: трасса мяча, теги игроков, карта ударов, форхенды и бэкхенды, оценка скорости и итог сессии.\",\n        models: en\n          ? [\n              { name: \"YOLO11m\", role: \"detects players and rackets in every frame\" },\n              { name: \"OpenCV · PnP\", role: \"calibrates the court from its lines; homography + camera position in 3D\" },\n              { name: \"Ball detector\", role: \"3-frame differencing + colour, then a guided search around the predicted flight\" },\n              { name: \"SciPy\", role: \"physical flight model (gravity, bounce) fitted to the detected ball\" },\n              { name: \"Claude Vision\", role: \"marks every shot and FH/BH from frame sheets\" }\n            ]\n          : [\n              { name: \"YOLO11m\", role: \"находит игроков и ракетки в каждом кадре\" },\n              { name: \"OpenCV · PnP\", role: \"калибрует корт по разметке: гомография и 3D-позиция камеры\" },\n              { name: \"Детектор мяча\", role: \"разность трёх кадров + цвет, затем прицельный поиск вокруг траектории\" },\n              { name: \"SciPy\", role: \"физическая модель полёта (гравитация, отскок), подогнанная к найденному мячу\" },\n              { name: \"Claude Vision\", role: \"размечает каждый удар и FH/BH по раскадровкам\" }\n            ]\n      },\n      {\n        key: \"player\",\n        letter: \"B\",\n        slug: \"tennis-player-breakdown\",\n        video: \"media/tennis-player.mp4\",\n        poster: \"media/tennis-player.jpg\",\n        zip: \"skills/tennis-player-breakdown.zip\",\n        size: en ? \"21 KB\" : \"21 КБ\",\n        tag: en ? \"Handheld · one player\" : \"Съёмка с рук · один игрок\",\n        title: en ? \"Player breakdown\" : \"Разбор игрока\",\n        desc: en\n          ? \"A handheld clip that follows one player from behind becomes a reel with a pose skeleton, a ball trail and a stats card: strokes, forehand/backhand split and shot speed.\"\n          : \"Ролик с рук, где камера ведёт одного игрока со спины, превращается в видео со скелетом, следом мяча и карточкой статистики: удары, форхенд/бэкхенд и скорость.\",\n        models: en\n          ? [\n              { name: \"YOLO11m-pose\", role: \"17-point pose skeleton; wrist speed peaks give swing candidates\" },\n              { name: \"YOLO11m\", role: \"racket and ball detection\" },\n              { name: \"Audio peaks\", role: \"exact contact moment from the sound of the hit\" },\n              { name: \"Perspective fit\", role: \"ball speed with gravity and camera pan compensation, ±25%\" },\n              { name: \"Claude Vision\", role: \"confirms every stroke by eye\" }\n            ]\n          : [\n              { name: \"YOLO11m-pose\", role: \"скелет из 17 точек; пики скорости кисти дают кандидатов в удары\" },\n              { name: \"YOLO11m\", role: \"находит ракетку и мяч\" },\n              { name: \"Аудио-пики\", role: \"точный момент контакта по звуку удара\" },\n              { name: \"Перспективная модель\", role: \"скорость мяча с учётом гравитации и панорамы камеры, ±25%\" },\n              { name: \"Claude Vision\", role: \"подтверждает каждый удар глазами\" }\n            ]\n      }\n    ];\n    return { guides, skills };\n  }\n\n  setLang = (lang) => {\n    this.setState({ lang }, () => this.syncDocLang(lang));\n    this.syncDocLang(lang);\n    try { localStorage.setItem(\"pa-lang\", lang); } catch (e) {}\n  };\n\n  addMark = (e) => {\n    const r = e.currentTarget.getBoundingClientRect();\n    const x = ((e.clientX - r.left) / r.width) * 100;\n    const y = ((e.clientY - r.top) / r.height) * 100;\n    const hue = 24 + Math.round(Math.random() * 176);\n    const marks = [...this.state.marks, { x, y, hue }].slice(-60);\n    this.setState({ marks });\n    try { localStorage.setItem(\"pa-marks\", JSON.stringify(marks)); } catch (err) {}\n  };\n\n  renderVals() {\n    const hero = this.props.hero ?? \"aura-blue\";\n    const en = this.state.lang === \"en\";\n    const t = en\n      ? {\n          heroMeta: \"Moscow · 2026\",\n          tennisLabel: \"01 — Tennis\",\n          tennisMeta: \"Claude Code skills · computer vision\",\n          tennisIntro: \"I film my practice sessions and break them down with Claude. Two skills turn an ordinary court video into an analytics reel: ball trace, strokes, speed.\",\n          tennisCta: \"Free to use · tell me what came out\",\n          modelsLabel: \"Under the hood\",\n          guideLabel: \"How to run\",\n          downloadLabel: \"Download .zip\",\n          closeLabel: \"Close\",\n          copyLabel: \"Copy\",\n          copiedLabel: \"Copied\",\n          aboutLabel: \"02 — About\",\n          aboutMeta: \"Product · people · square metres\",\n          talksLabel: \"03 — Video\",\n          talksMeta: \"Conferences · podcasts\",\n          talksCta: \"Invite me to talk about products, teams and research\",\n          contactLabel: \"04 — Contact\",\n          contactMeta: \"Usually reply in the evening\",\n          markHint: \"Click the background — leave a trace\",\n          markLine: \"Traces: \" + this.state.marks.length,\n          disclaimer: \"Some of the listed social networks belong to Meta, recognised as extremist and banned in Russia.\",\n          talkTitles: [\"Team lead vs product manager — who owes whom\", \"Gemba: don't trust your data\"]\n        }\n      : {\n          heroMeta: \"Москва · 2026\",\n          tennisLabel: \"01 — Теннис\",\n          tennisMeta: \"Скиллы для Claude Code · компьютерное зрение\",\n          tennisIntro: \"Снимаю свои тренировки и разбираю их вместе с Claude. Два скилла превращают обычное видео с корта в аналитический ролик: трасса мяча, удары, скорость.\",\n          tennisCta: \"Бесплатно · расскажите, что получилось\",\n          modelsLabel: \"Что внутри\",\n          guideLabel: \"Как запустить\",\n          downloadLabel: \"Скачать .zip\",\n          closeLabel: \"Закрыть\",\n          copyLabel: \"Копировать\",\n          copiedLabel: \"Скопировано\",\n          aboutLabel: \"02 — О себе\",\n          aboutMeta: \"Пр o: t.tennisIntro,\n      tennisCta: t.tennisCta,\n      modelsLabel: t.modelsLabel,\n      guideLabel: t.guideLabel,\n      closeLabel: t.closeLabel,\n      skills: tc.skills.map((k) => ({ ...k, downloadLabel: t.downloadLabel + \" · \" + k.size, open: () => this.openGuide(k.key) })),\n      guideOpen: !!g,\n      guide,\n      closeGuide: this.closeGuide,\n      aboutLabel: t.aboutLabel,\n      aboutMeta: t.aboutMeta,\n      talksLabel: t.talksLabel,\n      talksMeta: t.talksMeta,\n      talksCta: t.talksCta,\n      contactLabel: t.contactLabel,\n      contactMeta: t.contactMeta,\n      markHint: t.markHint,\n      markLine: t.markLine,\n      disclaimer: t.disclaimer,\n      addMark: this.addMark,\n      marks: this.state.marks.map((m) => ({\n        left: m.x + \"%\",\n        top: m.y + \"%\",\n        glow: \"radial-gradient(circle, hsla(\" + m.hue + \",70%,72%,0.55) 0%, hsla(\" + m.hue + \",70%,66%,0.22) 38%, hsla(\" + m.hue + \",70%,60%,0) 70%)\"\n      })),\n      talks: [\n        {\n          title: t.talkTitles[0],\n          duration: \"58:42\",\n          thumb: \"https://i.ytimg.com/vi/tMH41PAqZ2A/hqdefault.jpg\",\n          href: \"https://www.youtube.com/watch?v=tMH41PAqZ2A\"\n        },\n        {\n          title: t.talkTitles[1],\n          duration: \"32:15\",\n          thumb: \"https://i.ytimg.com/vi/NUV_XFGkUBc/hqdefault.jpg\",\n          href: \"https://www.youtube.com/watch?v=NUV_XFGkUBc\"\n        }\n      ],\n      socials: [\n        { name: \"YouTube\", handle: \"@osyagin\", href: \"https://www.youtube.com/user/osyagin\" },\n        { name: \"Instagram\", handle: \"@andreyosyagin\", href: \"https://www.instagram.com/andreyosyagin/\" },\n        { name: \"Facebook\", handle: \"@osyagin\", href: \"https://www.facebook.com/osyagin\" },\n        { name: \"LinkedIn\", handle: \"@andrey-osyagin\", href: \"https://www.linkedin.com/in/andrey-osyagin/\" }\n      ]\n    };\n  }\n}\n\n\u003C/script>\n\n\n\u003C/body>\u003C/html>"
